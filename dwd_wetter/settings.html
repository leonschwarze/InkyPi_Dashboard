<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Markiert gespeicherte Einstellungen: nicht angehakte Checkboxen gelten dann als "aus" -->
<input type="hidden" name="cfgVersion" value="1" />

<div class="form-group">
    <label class="form-label">Ort:</label>
    <div class="form-group dwd-search">
        <input type="text" id="dwdSearch" class="form-input" placeholder="Ort suchen, z. B. Bonn" />
        <button type="button" id="dwdSearchBtn" class="action-button compact">Suchen</button>
    </div>
    <div id="dwdResults" class="dwd-results"></div>
    <div class="form-group">
        <span>Breitengrad </span>
        <input type="text" id="latitude" name="latitude" class="form-input" placeholder="50.7374" />
    </div>
    <div class="form-group">
        <span>Längengrad </span>
        <input type="text" id="longitude" name="longitude" class="form-input" placeholder="7.0982" />
    </div>
    <button type="button" id="openMap" class="action-button compact">Auf Karte wählen</button>
</div>

<div class="form-group">
    <label class="form-label">Titel:</label>
    <div class="form-group">
        <input type="radio" id="title-auto" name="titleSelection" value="auto">
        <label for="title-auto">Ortsname vom DWD</label>
        <input type="radio" id="title-custom" name="titleSelection" value="custom">
        <label for="title-custom">Eigener Titel</label>
        <input type="text" id="customTitle" name="customTitle" class="form-input" placeholder="z. B. Zuhause" />
    </div>
</div>

<div class="form-group">
    <label class="form-label">Anzeige:</label>
    <div class="form-group"><input type="checkbox" class="dwd-check" id="showAlerts" name="showAlerts" value="true" data-default="true"><span>Amtliche DWD-Warnungen</span></div>
    <div class="form-group"><input type="checkbox" class="dwd-check" id="showMetrics" name="showMetrics" value="true" data-default="true"><span>Messwerte (Kacheln)</span></div>
    <div class="form-group">
        <input type="checkbox" class="dwd-check" id="showGraph" name="showGraph" value="true" data-default="true"><span>Stundenverlauf für die nächsten</span>
        <select id="hourlyHours" name="hourlyHours" class="form-input">
            <option value="12">12</option>
            <option value="24">24</option>
            <option value="36">36</option>
            <option value="48">48</option>
        </select>
        <span>Stunden</span>
    </div>
    <div class="form-group"><input type="checkbox" class="dwd-check" id="graphIcons" name="graphIcons" value="true" data-default="true"><span>Wettersymbole im Stundenverlauf</span></div>
    <div class="form-group"><input type="checkbox" class="dwd-check" id="nightShading" name="nightShading" value="true" data-default="true"><span>Nachtstunden grau hinterlegen</span></div>
    <div class="form-group">
        <input type="checkbox" class="dwd-check" id="showForecast" name="showForecast" value="true" data-default="true"><span>Vorhersage für</span>
        <select id="forecastDays" name="forecastDays" class="form-input">
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
        </select>
        <span>Tage</span>
    </div>
    <div class="form-group"><input type="checkbox" class="dwd-check" id="showFooter" name="showFooter" value="true" data-default="true"><span>Fußzeile (Quelle, Messstation, Uhrzeit)</span></div>
</div>

<div class="form-group">
    <label class="form-label">Messwerte:</label>
    {% for t in tiles %}
    <div class="form-group">
        <input type="checkbox" class="dwd-check" id="tile_{{ t.key }}" name="tile_{{ t.key }}" value="true" data-default="{{ 'true' if t.default else 'false' }}">
        <span>{{ t.label }}</span>
    </div>
    {% endfor %}
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal('mapModal')">×</span>
        <h2 id="modalTitle">Ort wählen</h2>
        <div class="separator"></div>
        <div id="map" style="width: 100%; height: 240px; margin: 10px 0px;"></div>
        <button type="button" id="closeMap" class="action-button">Übernehmen</button>
    </div>
</div>

<style>
    .dwd-search { display: flex; gap: 8px; align-items: center; flex: 1 1 100%; }
    .dwd-search .form-input { flex: 1; }
    .dwd-results { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; }
    .dwd-results button {
        text-align: left; padding: 6px 10px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border-color, #ccc); background: transparent; color: inherit; font: inherit;
    }
    .dwd-results button:hover { background: rgba(127, 127, 127, 0.15); }
    .dwd-results .dwd-hint { opacity: 0.7; font-size: 0.9em; }
</style>

<script>
(function () {
    const DEFAULTS = { titleSelection: 'auto', hourlyHours: '24', forecastDays: '5' };

    function hasCoord(v) {
        return typeof v === 'string' && v.trim() !== '' && Number.isFinite(Number(v.replace(',', '.')));
    }

    function validateCoordInputs() {
        const lat = document.getElementById('latitude').value.trim().replace(',', '.');
        const lon = document.getElementById('longitude').value.trim().replace(',', '.');
        if (lat === '' || lon === '') {
            showResponseModal('failure', 'Bitte einen Ort wählen oder Breiten- und Längengrad eingeben.');
            return false;
        }
        if (!hasCoord(lat) || !hasCoord(lon) || Math.abs(Number(lat)) > 90 || Math.abs(Number(lon)) > 180) {
            showResponseModal('failure', 'Breiten- und Längengrad sind ungültig.');
            return false;
        }
        document.getElementById('latitude').value = lat;
        document.getElementById('longitude').value = lon;
        return true;
    }

    // Vor dem Speichern/Aktualisieren prüfen
    const baseHandleAction = window.handleAction;
    window.handleAction = async function (action) {
        if (!validateCoordInputs()) return;
        return baseHandleAction(action);
    };
    const baseOpenModal = window.openModal;
    window.openModal = function (modalId) {
        if (modalId === 'scheduleModal' && !validateCoordInputs()) return;
        return baseOpenModal(modalId);
    };

    function setLocation(lat, lon, name) {
        document.getElementById('latitude').value = Number(lat).toFixed(4);
        document.getElementById('longitude').value = Number(lon).toFixed(4);
        if (name) {
            document.getElementById('dwdSearch').value = name;
        }
    }

    // ---- Ortssuche über OpenStreetMap/Nominatim (läuft im Browser) ----
    async function searchPlace() {
        const q = document.getElementById('dwdSearch').value.trim();
        const box = document.getElementById('dwdResults');
        box.innerHTML = '';
        if (!q) return;
        box.innerHTML = '<span class="dwd-hint">Suche …</span>';
        try {
            const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de'
                + '&countrycodes=de,at,ch,lu,li,be,nl,dk,pl,cz,fr&q=' + encodeURIComponent(q);
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            const items = await res.json();
            box.innerHTML = '';
            if (!items.length) {
                box.innerHTML = '<span class="dwd-hint">Kein Ort gefunden.</span>';
                return;
            }
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = item.display_name;
                btn.addEventListener('click', () => {
                    const name = item.name || item.display_name.split(',')[0];
                    setLocation(item.lat, item.lon, name);
                    const custom = document.getElementById('customTitle');
                    if (!custom.value.trim()) custom.value = name;
                    box.innerHTML = '<span class="dwd-hint">Übernommen: ' + item.display_name + '</span>';
                });
                box.appendChild(btn);
            });
        } catch (e) {
            box.innerHTML = '<span class="dwd-hint">Suche fehlgeschlagen – bitte Koordinaten manuell eingeben.</span>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dwdSearchBtn').addEventListener('click', searchPlace);
        document.getElementById('dwdSearch').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); searchPlace(); }
        });

        // ---- Karte ----
        let map, marker;
        document.getElementById('openMap').addEventListener('click', () => {
            const latV = document.getElementById('latitude').value;
            const lonV = document.getElementById('longitude').value;
            const has = hasCoord(latV) && hasCoord(lonV);
            const lat = has ? Number(latV) : 51.1;   // Mitte Deutschlands
            const lon = has ? Number(lonV) : 10.4;
            const zoom = has ? 10 : 5.5;
            openModal('mapModal');
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([lat, lon], zoom);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);
                    marker = L.marker([lat, lon], { draggable: true }).addTo(map);
                    map.on('click', ev => marker.setLatLng(ev.latlng));
                } else {
                    map.invalidateSize();
                    map.setView([lat, lon], zoom);
                    marker.setLatLng([lat, lon]);
                }
            }, 100);
        });
        document.getElementById('closeMap').addEventListener('click', () => {
            if (marker) {
                const p = marker.getLatLng().wrap();
                setLocation(p.lat, p.lng);
            }
            closeModal('mapModal');
        });

        // ---- Formular vorbelegen ----
        const saved = loadPluginSettings ? pluginSettings : {};
        const configured = loadPluginSettings && saved.cfgVersion !== undefined;

        document.querySelectorAll('.dwd-check').forEach(cb => {
            if (configured) {
                cb.checked = saved[cb.name] === 'true';
            } else if (loadPluginSettings && saved[cb.name] !== undefined) {
                cb.checked = saved[cb.name] === 'true';
            } else {
                cb.checked = cb.dataset.default === 'true';
            }
        });

        document.getElementById('latitude').value = saved.latitude ?? '';
        document.getElementById('longitude').value = saved.longitude ?? '';
        document.getElementById('customTitle').value = saved.customTitle ?? '';
        document.getElementById('hourlyHours').value = saved.hourlyHours || DEFAULTS.hourlyHours;
        document.getElementById('forecastDays').value = saved.forecastDays || DEFAULTS.forecastDays;
        const title = saved.titleSelection || DEFAULTS.titleSelection;
        document.querySelector(`input[name="titleSelection"][value="${title}"]`).checked = true;
    });
})();
</script>
